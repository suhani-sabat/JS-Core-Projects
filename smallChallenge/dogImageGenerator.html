<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dog Image generator</title>
  </head>
  <body>
    <img id="dog-image" src="" alt="Random Dog Image" width="300" />
    <button id="generate-btn">Generate Dog Image</button>
    <script>
      const button = document.querySelector("#generate-btn");
      let image = document.querySelector("#dog-image");
      button.addEventListener("click", () => {
        fetch("https://dog.ceo/api/breeds/image/random")
            .then(
                (response) => response.json()
            )
            .then(
                (data) => {
                    image.src = data.message;
                }
            )
            .catch(
                (error) => console.error("Error fetching dog image:", error)
            );
      });
    </script>
  </body>
</html>
