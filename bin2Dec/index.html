<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Binary to Decimal</title>
  </head>
  <style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    body {
        height: 100vh;
    }

.container {
    display: flex;
    height: 100vh;
    position: relative;
}

.left {
    width: 50%;
    background-color: #cb356b;
}

.right {
    width: 50%;
    background-color: #fff;
}

.card {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);

    padding: 30px;
    width: 400px;
    height: 300px;
    color: white;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    background: linear-gradient(to right, #155799, #159957);
    border-radius: 10px;

    box-shadow:
        rgba(0, 0, 0, 0.25) 0px 54px 55px,
        rgba(0, 0, 0, 0.12) 0px -12px 30px,
        rgba(0, 0, 0, 0.12) 0px 4px 6px,
        rgba(0, 0, 0, 0.17) 0px 12px 13px,
        rgba(0, 0, 0, 0.09) 0px -3px 5px;
    text-align: center;
    }
    input {
        margin: 10px;
        padding: 10px;
        width: 200px;
        border: 2px solid #155799;
        border-radius: 5px;
    }
    input[type="submit"] {
        background-color: white;
        color: #155799;
        font-weight: bold;
        cursor: pointer;
    }
  </style>
  <body>
      <div class="container">
        <div class="left"></div>
        <div class="right"></div>

        <div class="card">
          <form>
            <label for="bin2Dec">Enter a binary no. : </label>
            <input type="text" id="bin2Dec" />
            <br /><br />
            <input type="submit" value="Calculate" />
          </form>
          <p id="result"></p>
        </div>
      </div>
      <script src="script.js"></script>
  </body>
  
</html>
